<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AI Business Assistant</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: Arial, sans-serif;
}

body {
    background: #f4f7fb;
    color: #172033;
}

header {
    background: linear-gradient(135deg, #4f46e5, #7c3aed);
    color: white;
    padding: 28px 20px;
    text-align: center;
}

header h1 {
    font-size: 28px;
    margin-bottom: 8px;
}

header p {
    opacity: 0.9;
}

.container {
    max-width: 1100px;
    margin: auto;
    padding: 25px 15px;
}

.welcome,
.assistant,
.history {
    background: white;
    border-radius: 18px;
    padding: 25px;
    margin-bottom: 25px;
    box-shadow: 0 5px 20px rgba(0,0,0,0.07);
}

.welcome h2,
.assistant h2,
.history h2 {
    margin-bottom: 10px;
}

.welcome p {
    color: #687386;
    line-height: 1.6;
}

.tools {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 15px;
    margin-bottom: 25px;
}

.tool {
    background: white;
    border: 2px solid transparent;
    border-radius: 16px;
    padding: 22px;
    text-align: left;
    cursor: pointer;
    box-shadow: 0 5px 18px rgba(0,0,0,0.06);
    transition: 0.2s;
}

.tool:hover {
    transform: translateY(-3px);
    box-shadow: 0 8px 25px rgba(0,0,0,0.12);
}

.tool.active {
    border-color: #6366f1;
    background: #f8f7ff;
}

.tool .icon {
    font-size: 32px;
    margin-bottom: 12px;
}

.tool h3 {
    margin-bottom: 6px;
}

.tool p {
    color: #687386;
    font-size: 14px;
    line-height: 1.5;
}

label {
    display: block;
    font-weight: bold;
    margin-bottom: 8px;
}

textarea {
    width: 100%;
    min-height: 150px;
    padding: 15px;
    border: 1px solid #d5dbea;
    border-radius: 12px;
    resize: vertical;
    font-size: 16px;
    outline: none;
    line-height: 1.5;
}

textarea:focus {
    border-color: #6366f1;
    box-shadow: 0 0 0 3px rgba(99,102,241,0.1);
}

.buttons {
    display: flex;
    gap: 10px;
    margin-top: 15px;
    flex-wrap: wrap;
}

button {
    border: none;
    border-radius: 10px;
    padding: 12px 18px;
    cursor: pointer;
    font-size: 15px;
    font-weight: bold;
}

button:disabled {
    opacity: 0.6;
    cursor: not-allowed;
}

.generate {
    background: #4f46e5;
    color: white;
}

.generate:hover:not(:disabled) {
    background: #4338ca;
}

.clear {
    background: #e9edf5;
    color: #333;
}

.result {
    margin-top: 25px;
    padding: 20px;
    background: #f8f9ff;
    border-left: 5px solid #6366f1;
    border-radius: 10px;
    display: none;
}

.result-title {
    font-weight: bold;
    margin-bottom: 12px;
    color: #4f46e5;
    font-size: 18px;
}

#responseText {
    white-space: pre-wrap;
    line-height: 1.7;
    color: #283247;
}

.history-item {
    padding: 15px;
    border-bottom: 1px solid #eee;
    font-size: 14px;
    line-height: 1.5;
}

.history-item:last-child {
    border-bottom: none;
}

.history-tool {
    color: #4f46e5;
    font-weight: bold;
    margin-bottom: 5px;
}

.empty {
    color: #777;
    font-size: 14px;
}

.loading {
    color: #6366f1;
    font-weight: bold;
}

.status {
    margin-top: 12px;
    font-size: 14px;
    color: #6366f1;
}

footer {
    text-align: center;
    padding: 25px;
    color: #777;
    font-size: 14px;
}

@media(max-width:600px) {
    header h1 {
        font-size: 23px;
    }

    .container {
        padding: 15px 10px;
    }

    .welcome,
    .assistant,
    .history {
        padding: 18px;
    }

    .buttons button {
        width: 100%;
    }
}
</style>
